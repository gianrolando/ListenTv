name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run regression tests, build APK and run Android lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ListenTv-0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Print lint diagnostics
        if: always()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listentv-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30

  ui-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ListenTv-0.3.0-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            adb shell settings put system screen_off_timeout 600000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am start -W -n it.gianrolando.listentv/.MainActivity
            sleep 8
            mkdir -p screenshots
            adb shell screencap -p /sdcard/listentv.png
            adb pull /sdcard/listentv.png screenshots/ListenTv-phone.png
            adb shell wm size 1600x2560
            adb shell wm density 240
            sleep 5
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am force-stop it.gianrolando.listentv
            adb shell am start -W -n it.gianrolando.listentv/.MainActivity
            sleep 8
            adb shell uiautomator dump /sdcard/listentv-ui.xml
            adb pull /sdcard/listentv-ui.xml screenshots/ListenTv-tablet-ui.xml
            adb shell screencap -p /sdcard/listentv-tablet.png
            adb pull /sdcard/listentv-tablet.png screenshots/ListenTv-tablet.png
            adb logcat -d -s AndroidRuntime > screenshots/runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ListenTv-ui-preview
          path: screenshots/*
          if-no-files-found: error
          retention-days: 30
