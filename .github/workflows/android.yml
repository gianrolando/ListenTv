name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: listentv-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Print lint diagnostics
        if: always()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listentv-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
