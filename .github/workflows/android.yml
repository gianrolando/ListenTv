name: Build ListenTv
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Java formatting
        run: |
          curl --fail --location --retry 3 https://github.com/google/google-java-format/releases/download/v1.24.0/google-java-format-1.24.0-all-deps.jar -o /tmp/google-java-format.jar
          echo '812f805f58112460edf01bf202a8e61d0fd1f35c0d4fabd54220640776ec57a1  /tmp/google-java-format.jar' | sha256sum --check
          find app/src -name '*.java' -print0 | xargs -0 java -jar /tmp/google-java-format.jar --dry-run --set-exit-if-changed
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run regression tests, build APK and run Android lint
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:assembleDebug :app:lintRelease
      - name: Print failed unit-test diagnostics
        if: failure()
        run: find app/build/test-results -name '*.xml' -exec cat {} \;
      - name: Prepare unsigned release for private local signing
        run: |
          mkdir -p release-build
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-build/ListenTv-1.3.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-build/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-build/ListenTv-1.3.2-unsigned.apk > release-build/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ListenTv-1.3.2-unsigned-build
          path: release-build/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ListenTv-ui-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Print lint diagnostics
        if: always()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listentv-lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 30

  ui-preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ListenTv-ui-test-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8,1.1.1.1
          script: |
            adb install apk/app-debug.apk
            adb shell settings put system screen_off_timeout 600000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am start -W -n it.gianrolando.listentv/.MainActivity
            python3 scripts/check-guide-ui.py
            mkdir -p screenshots
            adb shell screencap -p /sdcard/listentv.png
            adb pull /sdcard/listentv.png screenshots/ListenTv-phone.png
            adb shell wm size 1600x2560
            adb shell wm density 240
            sleep 5
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am start -W -n it.gianrolando.listentv/.MainActivity
            python3 scripts/check-guide-ui.py
            adb shell uiautomator dump /sdcard/listentv-ui.xml
            adb pull /sdcard/listentv-ui.xml screenshots/ListenTv-tablet-ui.xml
            adb shell screencap -p /sdcard/listentv-tablet.png
            adb pull /sdcard/listentv-tablet.png screenshots/ListenTv-tablet.png
            adb logcat -d -s ListenTvGuide AndroidRuntime
            python3 -c 'import xml.etree.ElementTree as E; labels=[n.get("text", "") for n in E.parse("screenshots/ListenTv-tablet-ui.xml").iter("node")]; programmes=[s for s in labels if s.startswith("Now ·")]; print("GUIDE_UI_LABELS", labels[:90]); assert "48 channels" in labels; assert programmes, "No live guide titles in emulator"; print("GUIDE_UI_OK", programmes[:4])'
            adb logcat -d -s AndroidRuntime > screenshots/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ListenTv-ui-preview
          path: screenshots/*
          if-no-files-found: error
          retention-days: 30
